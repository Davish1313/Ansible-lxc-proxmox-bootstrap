---
- name: Bootstrap ansible user on LXC containers
  hosts: lxcs
  gather_facts: false
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
  pre_tasks:
    - name: Verify SSH connectivity as root
      ansible.builtin.ping:
      tags: always

    - name: Display target host info
      ansible.builtin.debug:
        msg: "Target: {{ inventory_hostname }} ({{ ansible_host }}:{{ ansible_port }}) as root"
      tags: always

  roles:
    - role: bootstrap_user
      tags: [bootstrap]

- name: Provision and maintain LXC containers
  hosts: lxcs
  vars:
    ansible_user: "{{ bootstrap_user_name | default('ansible') }}"
    ansible_ssh_private_key_file: "~/.ssh/ansible_lxc"
  pre_tasks:
    - name: Verify SSH connectivity as ansible user
      ansible.builtin.ping:
      tags: always

    - name: Display target host info
      ansible.builtin.debug:
        msg: "Target: {{ inventory_hostname }} ({{ ansible_host }}:{{ ansible_port }}) as {{ ansible_user }}"
      tags: always

  roles:
    - role: system_update
      tags: [update, upgrade, cleanup]
    - role: packages
      tags: [packages]
    # Tags: needrestart (solo informe), restart (reinicia servicios)
    - role: needrestart
    - role: copy_files
      tags: [copy_files]
    - role: git_source_install
      tags: [install_xtop]

- name: Show global summary
  hosts: lxcs
  connection: local
  become: false
  gather_facts: false
  vars:
    summary_host_group: lxcs
  tasks:
    - name: Collect reviewed host status
      ansible.builtin.set_fact:
        summary_host_status: >-
          {{ (summary_host_status | default([])) + [{
              'host': item,
              'services': hostvars[item].needrestart_summary_services | default(false) | bool,
              'sessions': hostvars[item].needrestart_summary_sessions | default(false) | bool,
              'reasons':
                (['servicios deferred'] if (hostvars[item].needrestart_summary_services | default(false) | bool) else [])
                + (['sesiones antiguas'] if (hostvars[item].needrestart_summary_sessions | default(false) | bool) else [])
                + (['kernel pendiente'] if (hostvars[item].needrestart_summary_kernel | default(false) | bool) else [])
            }] }}
      loop: "{{ groups[summary_host_group] | default([]) }}"
      when: hostvars[item].needrestart_summary_reviewed | default(false) | bool
      run_once: true
      tags: always

    - name: Build manual intervention list
      ansible.builtin.set_fact:
        summary_manual_list: >-
          {{ summary_manual_list | default([])
             + [(host_status.host | default('host')) ~ ': ' ~ (host_status.reasons | default([]) | join(', '))] }}
      loop: "{{ summary_host_status | default([]) | selectattr('reasons') | list }}"
      loop_control:
        loop_var: host_status
      run_once: true
      tags: always

    - name: Print global summary
      ansible.builtin.debug:
        msg: >-
          {{ ['==================== RESUMEN GLOBAL LXC ====================',
              'Servidores revisados: ' ~ (summary_host_status | default([]) | length),
              'OK: ' ~ (summary_host_status | default([]) | rejectattr('reasons') | list | length),
              'Con servicios deferred: ' ~ (summary_host_status | default([]) | selectattr('services') | list | length),
              'Con sesiones antiguas: ' ~ (summary_host_status | default([]) | selectattr('sessions') | list | length),
              'Requieren intervención manual:']
             + (summary_manual_list | default([])
                if (summary_manual_list | default([]) | length) > 0
                else ['- Ninguno'])
             + (['Nota: needrestart no se ejecutó en este run (usa --tags needrestart).']
                if (summary_host_status | default([]) | length) == 0 else []) }}
      run_once: true
      tags: always
